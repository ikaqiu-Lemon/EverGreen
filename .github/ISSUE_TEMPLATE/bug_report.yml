name: Bug report
description: Report reproducible incorrect behavior.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include private vault contents or credentials.
  - type: input
    id: version
    attributes:
      label: Evergreen version
      placeholder: Output of eg --version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: darwin/arm64, linux/amd64, ...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence of commands and inputs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
