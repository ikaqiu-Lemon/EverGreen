# tests/manifest/suites.yaml —— 全系统套件的唯一清单（合同 D4；由 tests/tools/suites.py 维护）
#
# 生成：python3 tests/tools/suites.py --write   （保留人工决策字段）
# 自检：python3 tests/tools/suites.py --check   （孤儿 / 幽灵 / schema / 语义，manifest profile 消费）
# 执行：bash tests/run.sh --profile <profile>   （runner 只从本文件派生计划）
#
# 字段语义（每条都有判据，见合同 D4/D5/D6）：
#   origin        inventory=可执行测试资产（与 inventory.tsv 的 suite_id 一一对应）；
#                 tool=元层判据入口（清单自检 / mutation / fuzz / make lint），不进覆盖矩阵
#   target        go=包模式（在物化树里跑）；shell/python=仓库相对脚本路径；make=Makefile 目标
#   min_cases     零执行下限。go 由盘面用例数现场推导（不许手填）；shell/python 由
#                 `--calibrate` 从真实 run 回填，只升不降
#   exclude_cases 仅用于**由 e2e 脚本驱动**的 go harness 用例：被排除的名字必须能在某支
#                 已登记 shell suite 里找到 `-run <名字>`，否则就是私自减覆盖（--check 判据）
#   required      true=必需（NOT_RUN 判 FAIL）；false=可选（NOT_RUN 单列、退出码 0）
#   not_run_when  仅 required:false 可填，且必须绑 issue：no_sibling_teamwork /
#                 no_go_toolchain / non_native_platform
#   evidence_re   shell/python suite 的证据标记正则（默认 `\[(?:ok|PASS)\]`）：
#   done_re       shell/python suite 的收尾标记正则（默认 `\[PASS\]` / `全部…通过`）：
#                 历史脚本收尾行形态不统一时逐条声明，禁止放宽默认族。
#                 命中次数即 case_count，用于「退出码 0 但什么都没跑」的判红
