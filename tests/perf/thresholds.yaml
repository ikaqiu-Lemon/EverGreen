# perf 门槛与语料规模（system_assurance · T-…-005 · 合同 D5「perf 属显式 profile，不进 core」）
#
# 为什么把门槛外置成数据
# --------------------
# 门槛此前写死在 bench_p95.sh 里（THRESH_* 五个 shell 变量）。数据与判据混在一起有两个问题：
#   1. 验收报告要引用门槛，只能复制粘贴脚本片段，抄错了没人发现；
#   2. 换采样环境必须**重新回填**（不是放宽），而"回填"这个动作需要一个明确的数据落点，
#      否则改动会以"顺手改个数"的形态混进脚本 diff 里。
# 因此门槛、语料规模、采样环境三者一起外置。脚本只读这里，不再自带默认值：
# 缺键即失败（fail-closed），不许"读不到就用内置值"——那等于门槛可被静默旁路。
#
# 口径（沿用 M5 合同 §7，逐字不改）
# ------------------------------
#   · P95 取第 48 小值，不插值；构建类两指标各 3 次取中位数；固定 20 词 / 20 id；进程墙钟。
#   · 门槛 = ceil(实测 × 1.5 / 10) × 10，与**采样环境绑定**。
#   · 门槛不是性能目标，是**回归护栏**：超门槛即 P0 回归，必须查而不是调门槛。
#
# 采样纪律：**必须独占跑**
# ----------------------
# 这条是实测教训，不是形式主义。T-…-005 期间曾在跑 bench 的同时并行跑 fuzz 与 mutation
# （同机 96 核），`card_show_p95_ms` 当场从 2373 冲到 4659（门槛 3620），报出一个不存在的
# P0 回归；同一份代码独占重跑即全绿。结论：并发负载会污染墙钟采样，读数不可用。
# 因此 perf 只能单独跑，不与其它 profile 并行，也不与构建 / 物化并行；
# 若怀疑超门槛，先确认是独占采样，再谈是不是回归。

corpus:
  cards: 10000
  relations: 30000
  domain: perf
  # 同参数两次生成必须逐字节相同（固定种子）；语料一变门槛即失去意义，
  # 所以 bench 脚本把"语料可复算"排在性能采样之前。
  deterministic: true

sampling_env:
  platform: linux/amd64
  logical_cores: 96
  go: 1.24.13
  cgo_enabled: 0
  note: 临时目录在本地磁盘；换任一项都需重新回填门槛，而不是放宽门槛。

measured:            # 2026-09-08 实测（10,000 卡 / 30,000 关系）
  search_p95_ms: 3198
  card_show_p95_ms: 2408
  rel_p95_ms: 2428
  index_build_ms: 6035
  index_incremental_ms: 9958

thresholds:          # = ceil(measured × 1.5 / 10) × 10
  search_p95_ms: 4800
  card_show_p95_ms: 3620
  rel_p95_ms: 3650
  index_build_ms: 9060
  index_incremental_ms: 14940
